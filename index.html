<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10252B">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Сервис: учёт ремонтов</title>
<style>
:root{
  --bg:#EDF1F2; --panel:#FFFFFF; --ink:#14262B; --muted:#5E7178; --line:#D8E0E3;
  --side:#10262B; --side-ink:#C9D8DB; --accent:#12A594; --accent-ink:#FFFFFF;
  --bad:#D6453D; --ok:#1E9A5A; --warn:#E39A1F; --chip:#E2EAEC; --brand:#1E88E5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1A1E; --panel:#13262B; --ink:#E6EFF1; --muted:#8FA5AB; --line:#24393F;
    --side:#081317; --side-ink:#A9BEC3; --accent:#2BC4B1; --accent-ink:#06201C;
    --chip:#1D3238; color-scheme: dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 10px 18px;color:#fff;font-weight:700;font-size:18px}
.brand img{max-width:100%;max-height:44px;display:block;background:#fff;border-radius:6px;padding:4px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--side-ink);opacity:.8}
nav button{all:unset;display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;padding:10px;border-radius:8px;cursor:pointer;color:var(--side-ink)}
nav button:hover{background:rgba(255,255,255,.07)}
nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-size:12px;background:rgba(255,255,255,.14);border-radius:10px;padding:0 7px}
main{padding:24px;min-width:0}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:24px;margin:0}
h2{font-size:17px;margin:0 0 10px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:21px}
.stat span{color:var(--muted);font-size:13px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--chip);border-radius:10px;padding:10px;min-height:200px}
.col h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600}.card .m{color:var(--muted);font-size:13px}.card .p{margin-top:6px;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
.search{position:relative;margin-bottom:14px}
.search input{padding:11px 12px 11px 38px;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.clients{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cl .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cl .h b{font-size:16px}.cl .h span{white-space:nowrap;font-weight:600}
.cl .rep{display:flex;justify-content:space-between;gap:10px;padding:8px 0 0;border-top:1px solid var(--line);margin-top:8px}
.cl .rep>div:last-child{text-align:right;white-space:nowrap;font-weight:600}
td:not(:first-child){white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.filters>div{flex:1;min-width:130px}.filters label{margin-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.stats.bal{grid-template-columns:1fr 1fr}
.bal .stat{border-left:4px solid var(--accent)}.bal .stat:nth-child(2){border-left-color:var(--brand)}
.bal .stat b{font-size:18px;margin:2px 0}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.item .ttl{font-weight:600}
.item .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.calc{margin-top:10px;padding:8px 10px;background:var(--chip);border-radius:8px;font-size:14px}
.byday summary{cursor:pointer;margin:2px 0 10px;font-weight:600}
.btn.danger{background:var(--bad);color:#fff}
.syncb{font-size:12px;margin-left:6px}
.amp{color:var(--brand)}
.brow{margin:8px 0}.bh{display:flex;justify-content:space-between;gap:10px;font-size:14px}.bh b{white-space:nowrap}
.bt{height:9px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:4px}.bt i{display:block;height:100%;border-radius:5px}
.pieW{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0}
.pie{width:120px;height:120px;border-radius:50%;flex:none}
.legend{display:grid;gap:4px;font-size:13px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.vbars{display:flex;align-items:flex-end;gap:3px;height:150px;overflow-x:auto;padding-bottom:2px}
.vb{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center;height:100%}
.vcol{flex:1;display:flex;align-items:flex-end;width:100%}.vcol i{display:block;width:100%;border-radius:3px 3px 0 0}
.vb span{font-size:10px;color:var(--muted)}
.dl{font-weight:700;font-size:12px}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}
details.an{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 14px 10px;margin:10px 0}
details.an>summary{cursor:pointer;font-size:17px;font-weight:700;padding:8px 0;list-style:none}
details.an>summary::-webkit-details-marker{display:none}
details.an h3{font-size:14px;margin:14px 0 4px;color:var(--muted)}
.cl details.rep{display:block;border-top:1px solid var(--line);margin-top:8px;padding:0}
.cl details.rep summary{display:flex;justify-content:space-between;gap:10px;padding:8px 0 4px;cursor:pointer;list-style:none}
.cl details.rep summary::-webkit-details-marker{display:none}
.cl details.rep summary>div:last-child{text-align:right;white-space:nowrap;font-weight:600}
.chev{display:inline-block;color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.mini{background:var(--chip);border-radius:8px;padding:6px 8px}
.mini b{display:block;font-size:14px}.mini span{font-size:12px;color:var(--muted)}
.kvs{margin:4px 0 8px;padding:6px 10px;background:var(--chip);border-radius:8px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv>span:first-child{color:var(--muted)}.kv>span:last-child{text-align:right}
.lcard h2{color:var(--brand)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative}.th img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:var(--bad);color:#fff;cursor:pointer;line-height:1}
dialog#phView{padding:0;border:0;background:transparent;width:100vw;max-width:100vw;height:100vh;max-height:100vh;display:flex;align-items:center;justify-content:center;cursor:pointer}
dialog#phView:not([open]){display:none}
dialog#phView::backdrop{background:rgba(0,0,0,.92)}
dialog#phView img{max-width:96%;max-height:92%;border-radius:8px}
.selq{margin-bottom:6px}
select[size]:not([size="1"]){padding:4px}
.bar2{height:8px;border-radius:4px;background:var(--accent);margin:6px 0 8px}
.updbar{position:fixed;top:0;left:0;right:0;z-index:60;background:#E39A1F;color:#1a1200;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.svcrow{display:flex;align-items:center;gap:10px;margin:4px 0}.svcrow span{flex:1}.svcrow input{width:90px}
.prow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}.prow:last-of-type{border-bottom:0}
.prow.tot{font-weight:700}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(380px,100%)}
.lcard h2{margin:14px 0 2px}.lbrand img{max-height:48px;max-width:100%}.lbrand b{font-size:22px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;vertical-align:middle}
.lang button{border:0;background:var(--panel);color:var(--ink);padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;margin:8px 0}.chk input{width:auto;margin-top:3px}
h3{font-size:15px;margin:14px 0 6px}
.navb{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding-top:8px}
a.btn{text-decoration:none;display:inline-block}
.who{display:flex;align-items:center;gap:8px;margin:-8px 0 14px;color:var(--muted);font-size:13px}
.who select{width:auto;padding:4px 8px;font-size:13px}
.lg{display:flex;gap:10px;padding:8px 10px;border-left:4px solid var(--line);background:var(--panel);border-radius:8px;margin-bottom:6px}
.lg .t{color:var(--muted);white-space:nowrap}
.lg.del{border-left-color:var(--bad)}.lg.warn{border-left-color:var(--warn)}.lg.money{border-left-color:var(--accent)}
.low{color:var(--bad);font-weight:600}.plus{color:var(--ok);font-weight:600}.minus{color:var(--bad);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;color:#fff;background:var(--pc,var(--muted));white-space:nowrap}
.bars{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;align-items:flex-end;gap:10px;height:220px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.logo-prev{display:flex;align-items:center;gap:12px;margin:6px 0;flex-wrap:wrap}
.logo-prev .box{background:#fff;border:1px dashed var(--line);border-radius:8px;min-width:120px;min-height:56px;display:flex;align-items:center;justify-content:center;padding:6px;color:#14233A;font-weight:800}
.logo-prev img{max-height:56px;max-width:200px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(440px,92vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=color]{padding:2px;height:38px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.empty{color:var(--muted);padding:12px 4px;font-size:13px}
.note{color:var(--muted);font-size:13px}

/* ---------- бланк ---------- */
#paperWrap{display:none;position:fixed;inset:0;background:rgba(10,20,25,.82);z-index:20;overflow:auto;padding:12px}
#paperWrap.open{display:block}
.ptool{max-width:794px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ptool select{width:auto;padding:6px 8px;font-size:13px}
.ptool .btn{padding:7px 11px;font-size:13px}
#sheetBox{margin:0 auto;overflow:hidden}
.sheet{width:794px;min-height:1120px;background:#fff;color:#14233A;padding:46px 60px 30px;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;font-size:15px;line-height:1.3;display:flex;flex-direction:column;transform-origin:top left}
.sheet *{box-sizing:border-box}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start}
.s-logo{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.s-logo b{color:var(--brand);font-weight:800}
.s-logo-img{max-height:72px;max-width:280px;display:block}
.s-sub{margin-top:18px;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#24407A;line-height:1.55}
.s-slogan{border-left:3px solid var(--brand);padding:2px 0 2px 14px;margin-top:10px;letter-spacing:.2em;text-transform:uppercase;font-size:12px;line-height:1.55;color:#24407A}
.s-title{margin:32px 0 26px;display:flex;justify-content:space-between;align-items:flex-end}
.s-title h2{font-size:32px;margin:0;font-weight:800;line-height:1.1;color:#14233A}
.sheet.ru .s-title h2{font-size:27px}
.s-title p{margin:2px 0 0;font-size:20px}
.s-num{display:flex;align-items:center;gap:10px;font-size:18px;color:#24407A}
.s-num input.fld{width:148px}
.sheet input.fld{height:31px;background:#E6EEFF;border:0;border-bottom:1px solid #B5C7EC;border-radius:0;padding:0 10px;color:#14233A;font:inherit;font-size:15px;width:100%}
.frow{display:grid;grid-template-columns:200px 1fr 51px;align-items:center;margin-bottom:19px;min-height:31px}
.frow .wide,.frow .dt{grid-column:2/4}
.flabel{display:flex;align-items:center;gap:20px;font-weight:700;font-size:17px;white-space:nowrap}
.flabel svg{color:var(--brand);flex:none}
.unit{padding-left:14px;color:#24407A;font-size:16px}
.nos{margin-bottom:17px}
.lines{display:grid;gap:6px;margin:6px 0 0 46px}
.dt{display:grid;grid-template-columns:177px 20px 55px 45px 55px 44px 1fr;align-items:end}
.dt i{font-style:normal;text-align:center;padding-bottom:4px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:14px}
.sig div{position:relative;height:100px;background:#EAF0FF;border-radius:12px;padding:15px 28px;color:#3A4A66;font-size:16px}
.sig div i{position:absolute;left:28px;right:28px;top:78px;border-bottom:1px solid #9aa3b8}
.thanks{border-left:3px solid var(--brand);padding:2px 0 2px 18px;margin-top:22px;font-size:16px}
.thanks b{display:block;font-size:17px}
.s-foot{margin-top:auto;padding-top:22px;display:flex;justify-content:space-between;align-items:flex-end;color:#24407A;font-size:14px}
.fc{display:flex;flex-wrap:wrap;align-items:center;margin:6px 0}
.fc span{display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid #b9c3d9;line-height:1.2}
.fc span:first-child{padding-left:0;border-left:0}
.fc svg{width:17px;height:17px;color:var(--brand);flex:none}
.logo-sm{width:220px;display:flex;flex-direction:column;align-items:center;font-size:31px;font-weight:800;letter-spacing:-1.2px;color:#14233A;line-height:1}
.logo-sm img{max-height:34px;max-width:170px}
.logo-sm small{align-self:stretch;text-align:center;margin-top:8px;border-top:2px solid var(--brand);padding-top:6px;font-size:10px;white-space:nowrap;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#24407A;line-height:1.2}
.sheet input.fld:disabled{color:#14233A;-webkit-text-fill-color:#14233A;opacity:1}
.sheet .sf{height:31px;line-height:30px;padding:0 10px;border-bottom:1px solid #9aa3b8;font-size:15px;overflow:hidden;white-space:nowrap;color:#14233A}
.s-num .sf{width:148px}
.lockmsg{max-width:794px;margin:0 auto 10px;background:#FFF4D6;color:#5A4300;border-radius:8px;padding:8px 12px;font-size:13px}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;left:0;right:0;z-index:5;flex-direction:row;padding:6px;overflow-x:auto}
  .brand{display:none}
  .navb{margin:0 0 0 6px;border-top:0;border-left:1px solid rgba(255,255,255,.2);padding:0 0 0 6px;display:flex;width:max-content}
  nav{display:flex;width:max-content;min-width:100%}
  nav button{justify-content:center;font-size:12px;padding:8px 10px;white-space:nowrap}
  nav .badge{display:none}
  main{padding:16px 14px 84px}
  .two{grid-template-columns:1fr}
  table{font-size:13px}
  th,td{padding:10px 6px}
}
@media print{
  .app,.ptool,.lockmsg,.toast,dialog{display:none!important}
  html,body{background:#fff;height:auto}
  #paperWrap.open{position:static;background:none;padding:0;overflow:visible;display:block}
  #sheetBox{width:auto!important;height:auto!important;overflow:visible}
  .sheet{transform:none!important;min-height:1120px;height:1122px;overflow:hidden}
  @page{size:A4;margin:0}
  .sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet input.fld{background:transparent!important;border-bottom:1px solid #9aa3b8!important}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand" id="brand"></div>
    <nav id="nav"></nav>
    <nav id="navBottom" class="navb"></nav>
  </aside>
  <main>
    <header class="top"><h1 id="title"></h1><div id="actions"></div></header>
    <div id="whobar" class="who"></div>
    <div id="view"></div>
  </main>
</div>

<div id="loginWrap" class="login"></div>
<dialog id="dlg"></dialog>
<div id="paperWrap"></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const addDays = n => {const d=new Date();d.setDate(d.getDate()+n);return isoOf(d)};
const addMonths = (iso,m) => {const d=new Date(iso+'T12:00:00');d.setMonth(d.getMonth()+m);return isoOf(d)};
const dmy = iso => iso.split('-').reverse().join('.');
const daysLeft = end => Math.round((new Date(end+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);
const num = n => new Intl.NumberFormat('ru-RU').format(n);
const money = n => new Intl.NumberFormat('ru-RU').format(n) + ' сум';
const dots = n => Number(n||0).toLocaleString('de-DE');
const esc = s => {const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};

function wInfo(o){
  if(!o.months) return {t:'Без гарантии',c:'var(--muted)'};
  const start=o.wStart||o.issued||o.date, end=addMonths(start,o.months), left=daysLeft(end);
  return left<0 ? {t:'Истекла',c:'var(--bad)',start,end,left}
    : {t:`Действует, ещё ${left} дн.`,c:left<=30?'var(--warn)':'var(--ok)',start,end,left};
}

let pinCb=null,pinLabel='';
function askPin(cb,label){
  if(!pinOn()&&!isOwner()){toast('Владелец ещё не задал код доступа');return}
  pinCb=cb;pinLabel=label||'Защищённое действие';
  $('dlg').innerHTML=pinOn()
    ?`<h2>Код доступа</h2><label>Введите код</label><input id="pin1" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')pinCheck()"><p id="pin-err" class="low"></p><div class="row"><button class="btn ghost" onclick="$('dlg').close()">Отмена</button><button class="btn" onclick="pinCheck()">Войти</button></div>`
    :`<h2>Задайте код доступа</h2><p class="note" style="margin-top:0">Код будет спрашиваться при входе в Настройки и при изменении или удалении финансовых операций. От 4 до 8 цифр.</p><label>Новый код</label><input id="pin1" type="password" inputmode="numeric" autocomplete="off"><label>Повторите код</label><input id="pin2" type="password" inputmode="numeric" autocomplete="off"><p id="pin-err" class="low"></p><div class="row"><button class="btn ghost" onclick="$('dlg').close()">Отмена</button><button class="btn" onclick="pinSet()">Сохранить код</button></div>`;
  if(!$('dlg').open)$('dlg').showModal();
  setTimeout(()=>{const e=$('pin1');if(e)e.focus()},50);
}
async function pinSet(){
  const a=$('pin1').value,b=$('pin2').value;
  if(!/^\d{4,8}$/.test(a)){$('pin-err').textContent='Код: от 4 до 8 цифр';return}
  if(a!==b){$('pin-err').textContent='Коды не совпадают';return}
  if(SYNC.on){try{const r=await sapi('/api/pin/set',{new:a});if(!r.ok)throw 0;state.pinSet=true}catch(e){$('pin-err').textContent='Не удалось сохранить код';return}}
  else state.pin=a;
  logAct('Задан код доступа');const cb=pinCb;pinCb=null;$('dlg').close();toast('Код доступа задан');if(cb)cb();
}
async function pinCheck(){
  const v=$('pin1').value;let ok=false,wait=0;
  if(SYNC.on){try{const r=await sapi('/api/pin/verify',{pin:v});ok=!!r.ok;wait=r.locked?r.wait:0}catch(e){ok=false}}else ok=v===state.pin;
  if(ok){const cb=pinCb;pinCb=null;$('dlg').close();if(cb)cb()}
  else{if(!wait)logAct('Неверный код: '+pinLabel,'warn');$('pin-err').textContent=wait?`Слишком много попыток. Подождите ${wait} мин.`:'Неверный код';$('pin1').value=''}
}
async function changePin(){
  const o=$('pc-old').value,n=$('pc-new').value;
  if(!/^\d{4,8}$/.test(n)){toast('Новый код: от 4 до 8 цифр');return}
  if(SYNC.on){try{const r=await sapi('/api/pin/set',{old:o,new:n});if(!r.ok){toast('Текущий код неверный');return}state.pinSet=true}catch(e){toast('Не удалось сменить код');return}}
  else{if(state.pin&&o!==state.pin){toast('Текущий код неверный');return}state.pin=n}
  logAct('Код доступа изменён');$('pc-old').value='';$('pc-new').value='';toast('Код изменён');
}

const unlockPrice=id=>guard('price',()=>openOrder(id,{priceOk:true}),`Изменение цены заказа №${id}`);

function expAddStock(id,step){

function expAddManual(id,step){
  const o=state.orders.find(x=>x.id===id),n=$('ex-name').value.trim(),c=+$('ex-cost').value,q=+$('ex-mq').value||0;

function expDel(id,eid,step){
  const o=state.orders.find(x=>x.id===id),k=o.exp.findIndex(e=>e.id===eid),e=o.exp[k];

function saveComment(id){const o=state.orders.find(x=>x.id===id);o.comment=$('o-comment').value.trim();logAct(`Комментарий к заказу №${o.id}: ${o.comment||'очищен'}`);toast('Комментарий сохранён')}

function backTo(id,target,ok){

function clientStats(){
  const f=state.df.clients,list=state.orders.filter(o=>!hasDF(f)||inR(o.date,f)),days={};
  list.forEach(o=>{const d=days[o.date]=days[o.date]||{k:new Set(),n:0};d.k.add(clientKey(o));d.n++});
  const uniq=new Set(list.map(clientKey)).size,visits=Object.values(days).reduce((s,d)=>s+d.k.size,0);
  const first=state.orders.map(o=>o.date).sort()[0]||today(),from=f.from||first,to=f.to||today();
  const span=Math.max(1,Math.round((new Date(to+'T12:00:00')-new Date(from+'T12:00:00'))/864e5)+1);
  const avg=visits/span,best=Object.entries(days).sort((a,b)=>b[1].k.size-a[1].k.size||b[0].localeCompare(a[0]))[0];
  const rows=Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0]));
  return `<div class="stats"><div class="stat"><b>${uniq}</b><span>клиентов за период</span></div><div class="stat"><b>${list.length}</b><span>заказов</span></div><div class="stat"><b>${(avg<1?avg.toFixed(2):avg.toFixed(1)).replace('.',',')}</b><span>клиентов в день в среднем (за ${span} дн.)</span></div><div class="stat"><b>${best?best[1].k.size:0}</b><span>${best?'больше всего за день: '+dmy(best[0]):'нет данных'}</span></div></div>

function savePhone(id){

function doSellAcc(){
  const a=curAcc();if(!a){toast('Выберите товар');return}
  const q=+$('as-qty').value||0,p=+$('as-price').value||0;
  if(q<1||!p){toast('Укажите цену и количество');return}
  if(q>a.qty){toast(`В наличии только ${a.qty} шт.`);return}
  if(p<a.min){toast(`Ниже минимальной цены: ${money(a.min)}`);return}
  const z={id:nid(),date:today(),accId:a.id,name:a.name,qty:q,price:p,buy:a.buy,min:a.min,seller:+$('as-seller').value,method:$('as-method').value==='card'?'card':'cash'};
  a.qty-=q;state.accSales.unshift(z);
  addCashEntry(z.date,`Продажа аксессуара: ${a.name} × ${q}`,q*p,`sale:acc:${z.id}`,z.method);logAct(`Продан аксессуар: ${a.name} × ${q} на ${money(q*p)}`,'money');
  $('dlg').close();render();toast(`Продано: ${a.name} × ${q}`);
}
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const cashIn=c=>{const f=state.cf;
  if(f.mode==='month')return c.date.slice(0,7)===f.month;
  if(f.mode==='year')return c.date.slice(0,4)===String(f.year);
  if(f.mode==='range')return (!f.from||c.date>=f.from)&&(!f.to||c.date<=f.to);
  return true};
const monthLabel=ym=>`${MN[+ym.slice(5,7)-1]} ${ym.slice(0,4)}`;
function setCF(k,v){state.cf[k]=v;render()}
function shiftCF(d){
  const f=state.cf;
  if(f.mode==='month'){const [y,m]=f.month.split('-').map(Number);const dt=new Date(y,m-1+d,1);f.month=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}`}
  if(f.mode==='year')f.year+=d;
  render();
}
function cashView(){
  const f=state.cf,all=state.cash;
  const years=[...new Set([...all.map(c=>+c.date.slice(0,4)),+today().slice(0,4),f.year])].sort();
  const perAll=all.filter(cashIn),mf=f.method||'all';
  const list=perAll.filter(c=>mf==='all'||methodOf(c)===mf).sort((a,b)=>b.date.localeCompare(a.date));
  const inc=list.filter(c=>c.sum>0).reduce((s,c)=>s+c.sum,0),exp=list.filter(c=>c.sum<0).reduce((s,c)=>s-c.sum,0);
  const title={month:monthLabel(f.month),year:`${f.year} год`,range:`${f.from?dmy(f.from):'начала'} — ${f.to?dmy(f.to):'сегодня'}`,all:'Всё время'}[f.mode];
  let ctrl='';
  if(f.mode==='month')ctrl=`<div><label>Месяц</label><input type="month" value="${f.month}" onchange="setCF('month',this.value||'${f.month}')"></div>`;
  if(f.mode==='year')ctrl=`<div><label>Год</label><select onchange="setCF('year',+this.value)">${years.map(y=>`<option ${y===f.year?'selected':''}>${y}</option>`).join('')}</select></div>`;
  if(f.mode==='range')ctrl=`<div><label>С даты</label><input type="date" value="${f.from}" onchange="setCF('from',this.value)"></div><div><label>По дату</label><input type="date" value="${f.to}" onchange="setCF('to',this.value)"></div>`;
  const filters=`<div class="filters"><div><label>Показать</label><select onchange="setCF('mode',this.value)">${[['month','Месяц'],['year','Год'],['range','Свой период'],['all','Всё время']].map(([v,t])=>`<option value="${v}" ${f.mode===v?'selected':''}>${t}</option>`).join('')}</select></div>${ctrl}${f.mode==='month'||f.mode==='year'?'<div style="flex:0 0 auto;display:flex;gap:6px"><button class="btn ghost" onclick="shiftCF(-1)">Раньше</button><button class="btn ghost" onclick="shiftCF(1)">Позже</button></div>':''}</div>`;
  const mon={};
  list.forEach(c=>{const k=c.date.slice(0,7);mon[k]=mon[k]||{inc:0,exp:0};if(c.sum>0)mon[k].inc+=c.sum;else mon[k].exp-=c.sum});
  if(f.mode==='year')for(let m=1;m<=12;m++){const k=`${f.year}-${pad(m)}`;mon[k]=mon[k]||{inc:0,exp:0}}
  const keys=Object.keys(mon).sort();
  let byMonth='';
  if(f.mode==='year'||keys.length>1){
    const max=Math.max(1,...keys.map(k=>Math.max(mon[k].inc,mon[k].exp)));
    byMonth=`<h2>По месяцам</h2><div class="bars" style="height:190px;margin-bottom:6px">${keys.map(k=>`<div class="bar"><div style="flex:1;min-height:0;display:flex;align-items:flex-end;gap:3px;width:100%"><i style="flex:1;width:auto;height:${mon[k].inc/max*100}%"></i><i style="flex:1;width:auto;height:${mon[k].exp/max*100}%;background:var(--bad)"></i></div><span>${MS[+k.slice(5,7)-1]}</span></div>`).join('')}</div>
    <p class="note" style="margin-top:0">Бирюзовые столбцы — приход, красные — расход.</p>
    <div class="tblwrap" style="margin-bottom:16px"><table><tr><th>Месяц</th><th>Приход, сум</th><th>Расход, сум</th><th>Итого, сум</th></tr>${keys.map(k=>`<tr><td>${f.mode==='year'?MN[+k.slice(5,7)-1]:monthLabel(k)}</td><td class="plus">${num(mon[k].inc)}</td><td class="minus">${num(mon[k].exp)}</td><td><b>${num(mon[k].inc-mon[k].exp)}</b></td></tr>`).join('')}<tr><td><b>Всего</b></td><td class="plus">${num(inc)}</td><td class="minus">${num(exp)}</td><td><b>${num(inc-exp)}</b></td></tr></table></div>`;
  }
  const ops=list.length?`<div class="tblwrap"><table><tr><th>Дата</th><th>Операция</th><th>Сумма</th></tr>${list.map(c=>`<tr><td>${dmy(c.date)}</td><td>${esc(c.text)}${c.edited?' <span class="note">(изменено)</span>':''} <span class="pill" style="--pc:${methodOf(c)==='card'?'#2F7FD1':'#1E9A5A'}">${methodOf(c)==='card'?'Карта':'Наличные'}</span><div style="margin-top:6px"><button class="btn sm ghost" onclick="editCash(${c.id})">Изменить</button></div></td><td class="${c.sum>0?'plus':'minus'}">${c.sum>0?'+':'−'}${money(Math.abs(c.sum))}</td></tr>`).join('')}</table></div>`:'<div class="empty">За этот период операций нет. Выберите другой период или добавьте операцию.</div>';

async function sheetToBlob(){
  const sh=document.querySelector('.sheet'),W=794,H=sh.offsetHeight;
  const clone=sh.cloneNode(true);clone.style.transform='none';
  const live=[...sh.querySelectorAll('input')];
  [...clone.querySelectorAll('input')].forEach((inp,i)=>{
    const d=document.createElement('div');
    d.className='sf'+(inp.classList.contains('wide')?' wide':'');
    d.textContent=live[i].value;inp.replaceWith(d);
  });
  const css=document.querySelector('style').textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const wrap=document.createElement('div');
  wrap.setAttribute('style',`--brand:${state.set.color};width:${W}px;height:${H}px`);
  wrap.appendChild(clone);
  const xml=new XMLSerializer().serializeToString(wrap);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W*2}" height="${H*2}" viewBox="0 0 ${W} ${H}"><foreignObject width="${W}" height="${H}"><style>${css}</style>${xml}</foreignObject></svg>`;
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
  const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
}

function saveStaff(id){
  const name=$('sf-name').value.trim(),login=$('sf-login').value.trim(),pass=$('sf-pass').value;
  if(!name||!login){toast('Укажите имя и логин');return}
  if(state.staff.some(m=>m.id!==id&&(m.login||'').toLowerCase()===login.toLowerCase())){toast('Такой логин уже есть');return}
  if((!id||pass)&&pass.length<4){toast('Пароль: не короче 4 символов');return}
  const own=id&&state.staff.find(x=>x.id===id).role==='Владелец';
  const perms={},pay={};
  if(!own){
    PERMS.forEach(([k])=>{if($('pm-'+k).checked)perms[k]=true});
    const n=v=>{const x=+v;return isFinite(x)&&x>0?x:0};
    pay.salary=n($('pay-salary').value);pay.base=$('pay-base').value;pay.defPct=Math.min(100,n($('pay-def').value));pay.pct={};
    state.services.forEach(x=>{const v=$('pay-svc-'+x.id).value;if(v!=='')pay.pct[x.id]=Math.min(100,n(v))});
    pay.phonePct=Math.min(100,n($('pay-phone').value));pay.accPct=Math.min(100,n($('pay-acc').value));pay.note=$('pay-note').value.trim();
  }
  const role=own?'Владелец':$('sf-role').value,roleTitle=role==='Другое'?$('sf-roletitle').value.trim():'';
  if(id){
    const m=state.staff.find(x=>x.id===id),payChanged=!own&&JSON.stringify(m.pay||{})!==JSON.stringify(pay);
    m.name=name;m.login=login;if(pass){if(SYNC.on)queuePw(m.id,pass);else m.pass=pass}
    if(!own){m.role=role;m.roleTitle=roleTitle;m.perms=perms;m.pay=pay}
    logAct(`Изменён сотрудник: ${name}${pass?' (новый пароль)':''}${payChanged?' (изменена оплата)':''}`,'warn');
  }else{
    {const sid=state.nextStaff++;state.staff.push(Object.assign({id:sid,name,role,roleTitle,login,perms,pay},SYNC.on?{}:{pass}));if(SYNC.on)queuePw(sid,pass)}
    logAct(`Добавлен сотрудник: ${name} (${role.toLowerCase()}), разрешений: ${Object.keys(perms).length}, оклад ${money(pay.salary||0)}`,'warn');
  }
  $('dlg').close();render();toast(id?'Сотрудник сохранён':'Сотрудник добавлен');
}

/* ---------- зарплаты (только владелец) ---------- */
const sumBy=(arr,f)=>arr.reduce((t,x)=>t+f(x),0);
function payCalc(m,ym){
  const pay=m.pay||{},inM=d=>!!d&&String(d).slice(0,7)===ym;
  const repairs=state.orders.filter(o=>o.status==='Выдан'&&o.master===m.id&&inM(o.issued)).map(o=>{
    const base=pay.base==='price'?o.price:Math.max(0,o.price-expSum(o));
    const own=pay.pct&&pay.pct[o.service]!==undefined&&pay.pct[o.service]!=='';
    const pct=own?+pay.pct[o.service]:(+pay.defPct||0);
    return{o,base,pct,sum:Math.round(base*pct/100)};
  });
  const phones=state.phones.filter(x=>x.sold&&x.seller===m.id&&inM(x.soldDate)).map(x=>{const pr=x.soldPrice-x.buy;return{x,pr,sum:Math.round(Math.max(0,pr)*(+pay.phonePct||0)/100)}});

function sdiff(a,b){
  const ops=[];
  SYNC_ARR.forEach(k=>{
    const am=new Map((a[k]||[]).map(r=>[r.id,JSON.stringify(r)])),bm=new Set();
    (b[k]||[]).forEach(r=>{bm.add(r.id);if(am.get(r.id)!==JSON.stringify(r))ops.push({c:k,op:'set',id:r.id,v:r})});
    am.forEach((_,id)=>{if(!bm.has(id))ops.push({c:k,op:'del',id})});
  });

}

function compressImage(file,max=900,q=0.65){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
    img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u;
  });
}

function orderPayOf(m,o){
  const pay=(m&&m.pay)||{},base=pay.base==='price'?o.price:Math.max(0,o.price-expSum(o));
  const own=pay.pct&&pay.pct[o.service]!==undefined&&pay.pct[o.service]!=='';
  return Math.round(base*(own?+pay.pct[o.service]:(+pay.defPct||0))/100);
}
function masterStats(inF){
  const rows={};
  const get=id=>{const m=state.staff.find(x=>x.id===id)||{id:0,name:'—',pay:{}};return rows[m.id]||(rows[m.id]={m,acc:0,iss:0,rev:0,exp:0,share:0,days:0,dn:0,sales:0,salesN:0})};
  state.orders.forEach(o=>{
    const r=get(o.master);
    if(inF(o.date))r.acc++;
    if(o.status==='Выдан'&&inF(o.issued)){
      r.iss++;r.rev+=o.price;r.exp+=expSum(o);r.share+=orderPayOf(r.m,o);
      if(o.date&&o.issued){r.days+=Math.max(0,Math.round((new Date(o.issued+'T12:00:00')-new Date(o.date+'T12:00:00'))/864e5));r.dn++}
    }
  });
  state.phones.filter(x=>x.sold&&inF(x.soldDate)).forEach(x=>{const r=get(x.seller);r.sales+=x.soldPrice-x.buy;r.salesN++});
  state.accSales.filter(z=>inF(z.date)).forEach(z=>{const r=get(z.seller);r.sales+=z.qty*(z.price-z.buy);r.salesN+=z.qty});
  return Object.values(rows).filter(r=>r.acc||r.iss||r.salesN).sort((a,b)=>(b.rev-b.exp+b.sales)-(a.rev-a.exp+a.sales));
}
function masterStatsView(inF){
  const rows=masterStats(inF);
  if(!rows.length)return '<div class="empty">За этот период данных по мастерам нет.</div>';
  const max=Math.max(1,...rows.map(r=>Math.max(0,r.rev-r.exp+r.sales)));
  const li=(t,v)=>`<div class="prow"><span>${t}</span><span class="nw">${v}</span></div>`;
  return rows.map(r=>{
    const profit=r.rev-r.exp;
    return `<div class="item"><div class="ttl">${esc(r.m.name)}${r.m.role?` · ${esc(roleName(r.m))}`:''}</div>
      <div class="bar2" style="width:${Math.round(Math.max(0,profit+r.sales)/max*100)}%"></div>
      ${li('Принято заказов',r.acc)}${li('Выдано заказов',r.iss)}${li('Выручка',money(r.rev))}${li('Расходы на ремонты',money(r.exp))}${li('Прибыль по ремонтам',sign(profit))}
      ${li('Доля мастера (по его процентам)',money(r.share))}${li('Остаётся сервису',sign(profit-r.share))}
      ${li('Средний чек',r.iss?money(Math.round(r.rev/r.iss)):'—')}${li('Средний срок ремонта',r.dn?(r.days/r.dn).toFixed(1).replace('.',',')+' дн.':'—')}
      ${li(`Продажи (${r.salesN} шт.), прибыль`,sign(r.sales))}</div>`;
  }).join('');
}

const PAL=['#12A594','#2F7FD1','#E39A1F','#D6453D','#8E6FD1','#43A047','#00ACC1','#EF6C00','#8D6E63','#7A8C92'];
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const pct1=(v,t)=>t>0?Math.round(v/t*1000)/10:0;
const fp=p=>String(p).replace('.',',')+'%';
const nrm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
function grp(arr,keyFn,valFn){

function bars(rows,total,fmt){

function pie(rows){

}
const dlt=(cur,prev)=>{

  const p=Math.round((cur-prev)/Math.abs(prev)*1000)/10;

function anPrevRange(f){

function anCollect(f){

function anKpi(d){
  const S=(a,f)=>a.reduce((t,x)=>t+f(x),0);
  const repRev=S(d.orders,o=>o.price),repExp=S(d.orders,o=>expSum(o));
  const phRev=S(d.phones,x=>x.soldPrice),phCost=S(d.phones,x=>x.buy);

  const stRev=S(d.stock,z=>z.qty*z.price),stCost=S(d.stock,z=>z.qty*z.cost);
  const ref=S(d.rets,r=>r.refund),cons=S(d.rets,r=>retExpSum(r)),rest=S(d.rets,r=>r.restockCost||0);
  const rev=repRev+phRev+acRev+stRev-ref,exp=repExp+phCost+acCost+stCost+cons-rest;
  const deals=d.orders.length+d.phones.length+S(d.acc,z=>z.qty)+S(d.stock,z=>z.qty);
  return {repRev,repExp,phRev,phCost,acRev,acCost,stRev,stCost,ref,cons,rest,rev,exp,profit:rev-exp,deals,
    rep:d.orders.length,sales:d.phones.length+d.acc.length+d.stock.length,rets:d.rets.length,
    avg:d.orders.length?Math.round(repRev/d.orders.length):0,

function anSeries(d,f){
  const ent=[];
  d.orders.forEach(o=>ent.push({date:o.issued,rev:o.price,pr:o.price-expSum(o)}));
  d.phones.forEach(x=>ent.push({date:x.soldDate,rev:x.soldPrice,pr:x.soldPrice-x.buy}));
  d.acc.forEach(z=>ent.push({date:z.date,rev:z.qty*z.price,pr:z.qty*(z.price-z.buy)}));
  d.stock.forEach(z=>ent.push({date:z.date,rev:z.qty*z.price,pr:z.qty*(z.price-z.cost)}));
  d.rets.forEach(r=>ent.push({date:r.date,rev:-r.refund,pr:-(r.refund+retExpSum(r)-(r.restockCost||0))}));
  if(!ent.length)return '<div class="empty">Нет данных за период.</div>';
  const ds=ent.map(e=>e.date).sort(),from=f.from||ds[0],to=f.to||today();
  const days=Math.round((new Date(to+'T12:00:00')-new Date(from+'T12:00:00'))/864e5)+1;
  const mode=days<=31?'d':days<=140?'w':'m';
  const wk=dt=>{const x=new Date(dt+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return isoOf(x)};
  const key=dt=>mode==='d'?dt:mode==='m'?dt.slice(0,7):wk(dt);
  const m=new Map();ent.forEach(e=>{const k=key(e.date),v=m.get(k)||{rev:0,pr:0};v.rev+=e.rev;v.pr+=e.pr;m.set(k,v)});
  const ks=[...m.keys()].sort().slice(-60),max=Math.max(1,...ks.map(k=>Math.abs(m.get(k).rev)));
  const lab=k=>mode==='d'?k.slice(8):mode==='m'?MS[+k.slice(5,7)-1]:dmy(k).slice(0,5);
  const best=[...m.entries()].sort((a,b)=>b[1].rev-a[1].rev)[0];
  return `<div class="vbars">${ks.map(k=>`<div class="vb" title="${k}: ${num(m.get(k).rev)} сум"><div class="vcol"><i style="height:${Math.max(2,Math.abs(m.get(k).rev)/max*100)}%;background:${m.get(k).rev<0?'var(--bad)':'var(--accent)'}"></i></div><span>${lab(k)}</span></div>`).join('')}</div>
    <p class="note">${mode==='d'?'По дням':mode==='w'?'По неделям (с понедельника)':'По месяцам'}. Столбец — выручка с учётом возвратов.${best?` Лучший период: ${mode==='d'?dmy(best[0]):mode==='m'?monthLabel(best[0]):'неделя с '+dmy(best[0])}, ${money(best[1].rev)}.`:''}</p>`;
}
function anWeekday(d){
  const cnt=Array(7).fill(0),rev=Array(7).fill(0);
