<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10252B">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Сервис: учёт ремонтов</title>
<style>
:root{
  --bg:#EDF1F2; --panel:#FFFFFF; --ink:#14262B; --muted:#5E7178; --line:#D8E0E3;
  --side:#10262B; --side-ink:#C9D8DB; --accent:#12A594; --accent-ink:#FFFFFF;
  --bad:#D6453D; --ok:#1E9A5A; --warn:#E39A1F; --chip:#E2EAEC; --brand:#1E88E5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1A1E; --panel:#13262B; --ink:#E6EFF1; --muted:#8FA5AB; --line:#24393F;
    --side:#081317; --side-ink:#A9BEC3; --accent:#2BC4B1; --accent-ink:#06201C;
    --chip:#1D3238; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh;height:100dvh;min-height:0;overflow:hidden}
aside{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow-y:auto}
.brand{padding:4px 10px 18px;color:#fff;font-weight:700;font-size:18px}
.brand img{max-width:100%;max-height:44px;display:block;background:#fff;border-radius:6px;padding:4px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--side-ink);opacity:.8}
nav button{all:unset;display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;padding:10px;border-radius:8px;cursor:pointer;color:var(--side-ink)}
nav button:hover{background:rgba(255,255,255,.07)}
nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-size:12px;background:rgba(255,255,255,.14);border-radius:10px;padding:0 7px}
main{padding:24px 24px 0;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:24px}
#whobar{flex:none}
header.top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:24px;margin:0}
h2{font-size:17px;margin:0 0 10px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:21px}
.stat span{color:var(--muted);font-size:13px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--chip);border-radius:10px;padding:10px;min-height:200px}
.col h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600}.card .m{color:var(--muted);font-size:13px}.card .p{margin-top:6px;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
.search{position:relative;margin-bottom:14px}
.search input{padding:11px 12px 11px 38px;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.clients{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cl .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cl .h b{font-size:16px}.cl .h span{white-space:nowrap;font-weight:600}
.cl .rep{display:flex;justify-content:space-between;gap:10px;padding:8px 0 0;border-top:1px solid var(--line);margin-top:8px}
.cl .rep>div:last-child{text-align:right;white-space:nowrap;font-weight:600}
td:not(:first-child){white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.filters>div{flex:1;min-width:130px}.filters label{margin-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.stats.bal{grid-template-columns:1fr 1fr}
.bal .stat{border-left:4px solid var(--accent)}.bal .stat:nth-child(2){border-left-color:var(--brand)}
.bal .stat b{font-size:18px;margin:2px 0}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.item .ttl{font-weight:600}
.item .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.calc{margin-top:10px;padding:8px 10px;background:var(--chip);border-radius:8px;font-size:14px}
.byday summary{cursor:pointer;margin:2px 0 10px;font-weight:600}
.btn.danger{background:var(--bad);color:#fff}
.syncb{font-size:12px;margin-left:6px}
.amp{color:var(--brand)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.ncard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:120px;overflow:hidden}
.ncard .nt{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.ncard .nb{font-size:13px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.ncard .nf{margin-top:auto;font-size:11px;color:var(--muted)}
.ncard .nph{height:70px;border-radius:8px;background:#e8eef0 center/cover no-repeat}
.ncard.lock{background:repeating-linear-gradient(135deg,var(--panel),var(--panel) 8px,#f1f5f6 8px,#f1f5f6 16px)}
.sheet .terms{font-size:11.5px;line-height:1.4;margin:6px 0 0;color:#24407A}
.sheet .cm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .uni{height:31px;line-height:30px;padding:0 10px;border-bottom:1px solid #B5C7EC;font-weight:700;color:#14233A}
.sheet.slip .frow{margin-bottom:11px}
.sheet.slip .nos{margin-bottom:6px}
.sheet.slip .s-title{margin:20px 0 16px}
.sheet.slip .sig{margin-top:10px}
.sheet.slip .sig div{height:84px}
.sheet.slip .sig div i{top:62px}
.sheet.slip .sig small{position:absolute;left:28px;right:28px;top:66px;font-size:12px;color:#3A4A66}
.sheet.slip .thanks{margin-top:14px}
.sbox{overscroll-behavior:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.sbox.canscroll{overflow-y:auto}
.sbox th{position:sticky;top:0;background:var(--panel);z-index:1}
.sbox.tblwrap{overflow-x:auto}
.cnt{color:var(--muted);font-weight:600;font-size:14px}
.brow{margin:8px 0}.bh{display:flex;justify-content:space-between;gap:10px;font-size:14px}.bh b{white-space:nowrap}
.bt{height:9px;border-radius:5px;background:var(--chip);overflow:hidden;margin-top:4px}.bt i{display:block;height:100%;border-radius:5px}
.pieW{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0}
.pie{width:120px;height:120px;border-radius:50%;flex:none}
.legend{display:grid;gap:4px;font-size:13px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.vbars{display:flex;align-items:flex-end;gap:3px;height:150px;overflow-x:auto;padding-bottom:2px}
.vb{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center;height:100%}
.vcol{flex:1;display:flex;align-items:flex-end;width:100%}.vcol i{display:block;width:100%;border-radius:3px 3px 0 0}
.vb span{font-size:10px;color:var(--muted)}
.dl{font-weight:700;font-size:12px}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}
details.an{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 14px 10px;margin:10px 0}
details.an>summary{cursor:pointer;font-size:17px;font-weight:700;padding:8px 0;list-style:none}
details.an>summary::-webkit-details-marker{display:none}
details.an h3{font-size:14px;margin:14px 0 4px;color:var(--muted)}
.cl details.rep{display:block;border-top:1px solid var(--line);margin-top:8px;padding:0}
.cl details.rep summary{display:flex;justify-content:space-between;gap:10px;padding:8px 0 4px;cursor:pointer;list-style:none}
.cl details.rep summary::-webkit-details-marker{display:none}
.cl details.rep summary>div:last-child{text-align:right;white-space:nowrap;font-weight:600}
.chev{display:inline-block;color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.mini{background:var(--chip);border-radius:8px;padding:6px 8px}
.mini b{display:block;font-size:14px}.mini span{font-size:12px;color:var(--muted)}
.kvs{margin:4px 0 8px;padding:6px 10px;background:var(--chip);border-radius:8px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv>span:first-child{color:var(--muted)}.kv>span:last-child{text-align:right}
.lcard h2{color:var(--brand)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative}.th img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:var(--bad);color:#fff;cursor:pointer;line-height:1}
dialog#phView{padding:0;border:0;background:transparent;width:100vw;max-width:100vw;height:100vh;max-height:100vh;display:flex;align-items:center;justify-content:center;cursor:pointer}
dialog#phView:not([open]){display:none}
dialog#phView::backdrop{background:rgba(0,0,0,.92)}
dialog#phView img{max-width:96%;max-height:92%;border-radius:8px}
.selq{margin-bottom:6px}
select[size]:not([size="1"]){padding:4px}
.bar2{height:8px;border-radius:4px;background:var(--accent);margin:6px 0 8px}
.updbar{position:fixed;top:0;left:0;right:0;z-index:60;background:#E39A1F;color:#1a1200;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.svcrow{display:flex;align-items:center;gap:10px;margin:4px 0}.svcrow span{flex:1}.svcrow input{width:90px}
.prow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}.prow:last-of-type{border-bottom:0}
.prow.tot{font-weight:700}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(380px,100%)}
.lcard h2{margin:14px 0 2px}.lbrand img{max-height:48px;max-width:100%}.lbrand b{font-size:22px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;vertical-align:middle}
.lang button{border:0;background:var(--panel);color:var(--ink);padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;margin:8px 0}.chk input{width:auto;margin-top:3px}
h3{font-size:15px;margin:14px 0 6px}
.navb{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding-top:8px}
a.btn{text-decoration:none;display:inline-block}
.who{display:flex;align-items:center;gap:8px;margin:-8px 0 14px;color:var(--muted);font-size:13px}
.who select{width:auto;padding:4px 8px;font-size:13px}
.lg{display:flex;gap:10px;padding:8px 10px;border-left:4px solid var(--line);background:var(--panel);border-radius:8px;margin-bottom:6px}
.lg .t{color:var(--muted);white-space:nowrap}
.lg.del{border-left-color:var(--bad)}.lg.warn{border-left-color:var(--warn)}.lg.money{border-left-color:var(--accent)}
.low{color:var(--bad);font-weight:600}.plus{color:var(--ok);font-weight:600}.minus{color:var(--bad);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;color:#fff;background:var(--pc,var(--muted));white-space:nowrap}
.bars{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;align-items:flex-end;gap:10px;height:220px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.logo-prev{display:flex;align-items:center;gap:12px;margin:6px 0;flex-wrap:wrap}
.logo-prev .box{background:#fff;border:1px dashed var(--line);border-radius:8px;min-width:120px;min-height:56px;display:flex;align-items:center;justify-content:center;padding:6px;color:#14233A;font-weight:800}
.logo-prev img{max-height:56px;max-width:200px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(440px,92vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=color]{padding:2px;height:38px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.empty{color:var(--muted);padding:12px 4px;font-size:13px}
.note{color:var(--muted);font-size:13px}

/* ---------- бланк ---------- */
#paperWrap{display:none;position:fixed;inset:0;background:rgba(10,20,25,.82);z-index:20;overflow:auto;padding:12px}
#paperWrap.open{display:block}
.ptool{max-width:794px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ptool select{width:auto;padding:6px 8px;font-size:13px}
.ptool .btn{padding:7px 11px;font-size:13px}
#sheetBox{margin:0 auto;overflow:hidden}
.sheet{width:794px;min-height:1120px;background:#fff;color:#14233A;padding:46px 60px 30px;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;font-size:15px;line-height:1.3;display:flex;flex-direction:column;transform-origin:top left}
.sheet *{box-sizing:border-box}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start}
.s-logo{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.s-logo b{color:var(--brand);font-weight:800}
.s-logo-img{max-height:72px;max-width:280px;display:block}
.s-sub{margin-top:18px;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#24407A;line-height:1.55}
.s-slogan{border-left:3px solid var(--brand);padding:2px 0 2px 14px;margin-top:10px;letter-spacing:.2em;text-transform:uppercase;font-size:12px;line-height:1.55;color:#24407A}
.s-title{margin:32px 0 26px;display:flex;justify-content:space-between;align-items:flex-end}
.s-title h2{font-size:32px;margin:0;font-weight:800;line-height:1.1;color:#14233A}
.sheet.ru .s-title h2{font-size:27px}
.s-title p{margin:2px 0 0;font-size:20px}
.s-num{display:flex;align-items:center;gap:10px;font-size:18px;color:#24407A}
.s-num input.fld{width:148px}
.sheet input.fld{height:31px;background:#E6EEFF;border:0;border-bottom:1px solid #B5C7EC;border-radius:0;padding:0 10px;color:#14233A;font:inherit;font-size:15px;width:100%}
.frow{display:grid;grid-template-columns:200px 1fr 51px;align-items:center;margin-bottom:19px;min-height:31px}
.frow .wide,.frow .dt{grid-column:2/4}
.flabel{display:flex;align-items:center;gap:20px;font-weight:700;font-size:17px;white-space:nowrap}
.flabel svg{color:var(--brand);flex:none}
.unit{padding-left:14px;color:#24407A;font-size:16px}
.nos{margin-bottom:17px}
.lines{display:grid;gap:6px;margin:6px 0 0 46px}
.dt{display:grid;grid-template-columns:177px 20px 55px 45px 55px 44px 1fr;align-items:end}
.dt i{font-style:normal;text-align:center;padding-bottom:4px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:14px}
.sig div{position:relative;height:100px;background:#EAF0FF;border-radius:12px;padding:15px 28px;color:#3A4A66;font-size:16px}
.sig div i{position:absolute;left:28px;right:28px;top:78px;border-bottom:1px solid #9aa3b8}
.thanks{border-left:3px solid var(--brand);padding:2px 0 2px 18px;margin-top:22px;font-size:16px}
.thanks b{display:block;font-size:17px}
.s-foot{margin-top:auto;padding-top:22px;display:flex;justify-content:space-between;align-items:flex-end;color:#24407A;font-size:14px}
.fc{display:flex;flex-wrap:wrap;align-items:center;margin:6px 0}
.fc span{display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid #b9c3d9;line-height:1.2}
.fc span:first-child{padding-left:0;border-left:0}
.fc svg{width:17px;height:17px;color:var(--brand);flex:none}
.logo-sm{width:220px;display:flex;flex-direction:column;align-items:center;font-size:31px;font-weight:800;letter-spacing:-1.2px;color:#14233A;line-height:1}
.logo-sm img{max-height:34px;max-width:170px}
.logo-sm small{align-self:stretch;text-align:center;margin-top:8px;border-top:2px solid var(--brand);padding-top:6px;font-size:10px;white-space:nowrap;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#24407A;line-height:1.2}
.sheet input.fld:disabled{color:#14233A;-webkit-text-fill-color:#14233A;opacity:1}
.sheet .sf{height:31px;line-height:30px;padding:0 10px;border-bottom:1px solid #9aa3b8;font-size:15px;overflow:hidden;white-space:nowrap;color:#14233A}
.s-num .sf{width:148px}
.lockmsg{max-width:794px;margin:0 auto 10px;background:#FFF4D6;color:#5A4300;border-radius:8px;padding:8px 12px;font-size:13px}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;left:0;right:0;z-index:5;flex-direction:row;padding:6px;overflow-x:auto}
  .brand{display:none}
  .navb{margin:0 0 0 6px;border-top:0;border-left:1px solid rgba(255,255,255,.2);padding:0 0 0 6px;display:flex;width:max-content}
  nav{display:flex;width:max-content;min-width:100%}
  nav button{justify-content:center;font-size:12px;padding:8px 10px;white-space:nowrap}
  nav .badge{display:none}
  main{padding:16px 14px 70px}
  .two{grid-template-columns:1fr}
  table{font-size:13px}
  th,td{padding:10px 6px}
}
@media print{
  .app,.ptool,.lockmsg,.toast,dialog{display:none!important}
  html,body{background:#fff;height:auto!important;overflow:visible!important}

}
function presetDF(k,p){
  const f=state.df[k];
  if(p==='all'){f.from='';f.to=''}
  if(p==='today'){f.from=f.to=today()}
  if(p==='yesterday'){f.from=f.to=addDays(-1)}
  if(p==='7'){f.from=addDays(-6);f.to=today()}
  if(p==='30'){f.from=addDays(-29);f.to=today()}
  if(p==='month'){const d=new Date();f.from=isoOf(new Date(d.getFullYear(),d.getMonth(),1));f.to=today()}
  if(p==='pmonth'){const d=new Date();f.from=isoOf(new Date(d.getFullYear(),d.getMonth()-1,1));f.to=isoOf(new Date(d.getFullYear(),d.getMonth(),0))}

  render();
}

function askPin(cb,label){
  if(!pinOn()&&!isOwner()){toast('Владелец ещё не задал код доступа');return}
  pinCb=cb;pinLabel=label||'Защищённое действие';

    :`<h2>Задайте код доступа</h2><p class="note" style="margin-top:0">Код будет спрашиваться при входе в Настройки и при изменении или удалении финансовых операций. От 4 до 8 цифр.</p><label>Новый код</label><input id="pin1" type="password" inputmode="numeric" autocomplete="off"><label>Повторите код</label><input id="pin2" type="password" inputmode="numeric" autocomplete="off"><p id="pin-err" class="low"></p><div class="row"><button class="btn ghost" onclick="$('dlg').close()">Отмена</button><button class="btn" onclick="pinSet()">Сохранить код</button></div>`;
  if(!$('dlg').open)$('dlg').showModal();
  setTimeout(()=>{const e=$('pin1');if(e)e.focus()},50);
}
async function pinSet(){
  const a=$('pin1').value,b=$('pin2').value;
  if(!/^\d{4,8}$/.test(a)){$('pin-err').textContent='Код: от 4 до 8 цифр';return}
  if(a!==b){$('pin-err').textContent='Коды не совпадают';return}
  if(SYNC.on){try{const r=await sapi('/api/pin/set',{new:a});if(!r.ok)throw 0;state.pinSet=true}catch(e){$('pin-err').textContent='Не удалось сохранить код';return}}
  else state.pin=a;
  logAct('Задан код доступа');const cb=pinCb;pinCb=null;$('dlg').close();toast('Код доступа задан');if(cb)cb();
}
async function pinCheck(){
  const v=$('pin1').value;let ok=false,wait=0;
  if(SYNC.on){try{const r=await sapi('/api/pin/verify',{pin:v});ok=!!r.ok;wait=r.locked?r.wait:0}catch(e){ok=false}}else ok=v===state.pin;
  if(ok){const cb=pinCb;pinCb=null;$('dlg').close();if(cb)cb()}
  else{if(!wait)logAct('Неверный код: '+pinLabel,'warn');$('pin-err').textContent=wait?`Слишком много попыток. Подождите ${wait} мин.`:'Неверный код';$('pin1').value=''}
}

function fitLists(){
  const bar=document.querySelector('aside'),barH=(bar&&getComputedStyle(bar).position==='fixed')?bar.offsetHeight:0;
  const vw=$('view'),avail=Math.max(280,Math.min(viewH()-barH-70,(vw?vw.clientHeight:99999)-8));
  document.querySelectorAll('.sbox[data-rows]').forEach(b=>{
    b.style.maxHeight='';b.classList.remove('canscroll');
    if(b.getClientRects().length===0)return;
    const n=+b.dataset.rows,els=[...b.querySelectorAll(b.dataset.sel||':scope > *')].filter(e=>!e.classList.contains('empty')&&e.getClientRects().length);
    const rows=els.filter(e=>!e.querySelector('th'));
    if(rows.length<2)return;
    const top=b.getBoundingClientRect().top,lim=Math.min(n,rows.length);
    let take=1;
    for(let i=0;i<lim;i++){if(rows[i].getBoundingClientRect().bottom-top+2<=avail)take=i+1;else break}
    take=Math.max(take,Math.min(2,rows.length));
    if(rows.length<=take)return;
    b.style.maxHeight=Math.ceil(rows[take-1].getBoundingClientRect().bottom-top+2)+'px';b.classList.add('canscroll');
  });
}

  const o=state.orders.find(x=>x.id===id),i=STATUSES.findIndex(s=>s.n===o.status);
  if($('price')&&itemsOf(o).length<2)setSinglePrice(o,+$('price').value||o.price);
  if(STATUSES[i+1].n==='Готов'){expDlg(id,true);return}
  if(STATUSES[i+1].n==='Выдан'){if(o.price>0)payDlg(id);else issueOrder(id,0,0);return}
  o.status=STATUSES[i+1].n;
  logAct(`Заказ №${o.id} переведён в «${o.status}»`);
  $('dlg').close();render();toast(`Заказ №${o.id}: ${o.status}`);
}
function payDlg(id,cash){
  const o=state.orders.find(x=>x.id===id),total=o.price,c=cash===undefined?total:cash;
  $('dlg').innerHTML=`<h2>Выдача заказа №${o.id}</h2><div class="note">${esc(o.device)} · ${esc(o.client)}</div>
    <div class="calc">К оплате: <b>${money(total)}</b></div>
    <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn sm ghost" onclick="pdSet(${id},${total})">Всё наличными</button><button class="btn sm ghost" onclick="pdSet(${id},0)">Всё картой</button></div>
    <div class="two"><div><label>Наличными, сум</label><input id="pay-cash" type="number" min="0" value="${c}" oninput="pdCalc(${id},'cash')"></div><div><label>Картой / переводом, сум</label><input id="pay-card" type="number" min="0" value="${total-c}" oninput="pdCalc(${id},'card')"></div></div>
    <div class="calc" id="pay-note"></div>
    <div class="row"><button class="btn ghost" onclick="openOrder(${id})">Назад</button><button class="btn" onclick="pdConfirm(${id})">Выдать заказ</button></div>`;
  if(!$('dlg').open)$('dlg').showModal();pdNote(id);
}
function pdSet(id,cash){const o=state.orders.find(x=>x.id===id);$('pay-cash').value=cash;$('pay-card').value=o.price-cash;pdNote(id)}
function pdCalc(id,w){
  const o=state.orders.find(x=>x.id===id),t=o.price;
  if(w==='cash')$('pay-card').value=Math.max(0,t-(+$('pay-cash').value||0));else $('pay-cash').value=Math.max(0,t-(+$('pay-card').value||0));
  pdNote(id);
}
function pdNote(id){
  const o=state.orders.find(x=>x.id===id),s=(+$('pay-cash').value||0)+(+$('pay-card').value||0);
  $('pay-note').innerHTML=s===o.price?'Сумма оплат сходится.':`<span class="low">Сумма оплат ${money(s)}, нужно ${money(o.price)}.</span>`;
}
function pdConfirm(id){
  const o=state.orders.find(x=>x.id===id),cash=+$('pay-cash').value||0,card=+$('pay-card').value||0;
  if(cash<0||card<0||cash+card!==o.price){toast(`Сумма оплат должна быть равна стоимости: ${money(o.price)}`);return}
  issueOrder(id,cash,card);
}
function issueOrder(id,cash,card){
  const o=state.orders.find(x=>x.id===id);
  o.status='Выдан';o.issued=today();o.payCash=cash;o.payCard=card;
  if(cash>0)addCashEntry(today(),`Заказ №${o.id} выдан (наличные)`,cash,`order:${o.id}`,'cash');
  if(card>0)addCashEntry(today(),`Заказ №${o.id} выдан (карта)`,card,`order:${o.id}`,'card');
  logAct(`Заказ №${o.id} переведён в «Выдан» на ${money(o.price)} (наличные ${money(cash)}, карта ${money(card)}), расходы ${money(expSum(o))}, прибыль ${money(o.price-expSum(o))}`,'money');
  $('dlg').close();render();toast(`Заказ №${o.id}: Выдан`);
}
function backTo(id,target,ok){
  const o=state.orders.find(x=>x.id===id),ti=STATUSES.findIndex(s=>s.n===target),i=STATUSES.findIndex(s=>s.n===o.status);
  if(ti<0||ti>=i)return;
  if(o.status==='Выдан'&&!ok){toast('Закрытый заказ может изменить только владелец');return}
  if(o.status==='Выдан'){delete o.issued;delete o.payCash;delete o.payCard;removeCashRef(`order:${o.id}`,`Заказ №${o.id} выдан`);state.cancellations.unshift({id:nid(),date:today(),kind:'order',title:`${o.device} (заказ №${o.id})`,qty:1,amount:o.price,cost:expSum(o),action:'',by:state.me})}
  o.status=target;logAct(`Заказ №${o.id} возвращён в «${o.status}»`,'warn');$('dlg').close();render();toast(`Заказ №${o.id} возвращён: ${o.status}`);
}
function back(id){
  const o=state.orders.find(x=>x.id===id),i=STATUSES.findIndex(s=>s.n===o.status);
  if(i<1)return;
  if(o.status==='Выдан'){
    if(!isOwner()){logAct(`Попытка вернуть закрытый заказ №${id} из «Выдан»`,'warn');toast('Закрытый заказ может изменить только владелец');return}
    askPin(()=>backTo(id,STATUSES[i-1].n,true),`Возврат закрытого заказа №${id} из «Выдан»`);return;
  }
  backTo(id,STATUSES[i-1].n);
}

function addOrder(){
  const g=id=>$(id).value.trim();
  if(!g('f-client')||!g('f-device')){toast('Укажите клиента и модель');return}
  const im1=imeiDigits(g('f-imei')),im2=imeiDigits(g('f-imei2'));
  const bad=(im1&&!imeiValid(im1))||(im2&&!imeiValid(im2));
  if(bad&&window.__imeiWarn!==im1+'|'+im2){window.__imeiWarn=im1+'|'+im2;toast('IMEI похож на ошибочный (нужно 15 цифр). Проверьте или нажмите ещё раз, чтобы сохранить как есть.');return}
  window.__imeiWarn=null;
  const o={id:state.nextId++,client:g('f-client'),phone:phoneDigits(g('f-phone')).length>3?g('f-phone'):'—',device:g('f-device'),imei:im1,imei2:im2,defects:[g('f-d1'),g('f-d2'),''],price:+g('f-price')||0,months:+g('f-months')||0,master:+$('f-master').value,service:+$('f-service').value||0,status:'Принят',date:today()};
  o.items=[{id:nid(),service:o.service,master:o.master,price:o.price}];

}

const clientKey=o=>phoneDigits(o.phone).length>3?phoneDigits(o.phone):o.client.toLowerCase();
function clientsView(){return dateBar('clients')+clientStats()+searchBox('Поиск клиента по имени, фамилии или номеру')+`<div id="res">${clientsList()}</div>`}
function clientStats(){
  const f=state.df.clients,list=state.orders.filter(o=>!hasDF(f)||inR(o.date,f)),days={};
  list.forEach(o=>{const d=days[o.date]=days[o.date]||{k:new Set(),n:0};d.k.add(clientKey(o));d.n++});
  const uniq=new Set(list.map(clientKey)).size,visits=Object.values(days).reduce((s,d)=>s+d.k.size,0);
  const first=state.orders.map(o=>o.date).sort()[0]||today(),from=f.from||first,to=f.to||today();
  const span=Math.max(1,Math.round((new Date(to+'T12:00:00')-new Date(from+'T12:00:00'))/864e5)+1);
  const avg=visits/span,best=Object.entries(days).sort((a,b)=>b[1].k.size-a[1].k.size||b[0].localeCompare(a[0]))[0];
  const rows=Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0]));
  return `<div class="stats"><div class="stat"><b>${uniq}</b><span>клиентов за период</span></div><div class="stat"><b>${list.length}</b><span>заказов</span></div><div class="stat"><b>${(avg<1?avg.toFixed(2):avg.toFixed(1)).replace('.',',')}</b><span>клиентов в день в среднем (за ${span} дн.)</span></div><div class="stat"><b>${best?best[1].k.size:0}</b><span>${best?'больше всего за день: '+dmy(best[0]):'нет данных'}</span></div></div>
  <details class="byday"><summary>Клиенты по дням</summary>${rows.length?`<div class="tblwrap"><table><tr><th>Дата</th><th>Клиентов</th><th>Заказов</th></tr>${rows.map(([d,v])=>`<tr><td>${dmy(d)}</td><td>${v.k.size}</td><td>${v.n}</td></tr>`).join('')}</table></div>`:'<div class="empty">За этот период клиентов не было.</div>'}</details>`;
}

function sellPart(pre){
  const ps=state.parts.map((p,i)=>({p,i})).filter(x=>x.p.qty>0);
  if(!ps.length){toast('На складе нет товара');return}
  $('dlg').innerHTML=`<h2>Продажа со склада</h2><label>Товар</label>${selBox('sl-part',ps.map(x=>({v:x.i,t:`${x.p.name} — ${x.p.qty} шт.`})),sellFill,pre)}

function sellFill(){const v=$('sl-part').value;if(v===''){$('sl-price').value='';$('sl-calc').textContent='';return}const p=state.parts[+v];$('sl-price').value=p.price||'';sellCalc()}
function sellCalc(){
  if($('sl-part').value==='')return;
  const p=state.parts[+$('sl-part').value],q=+$('sl-qty').value||0,pr=+$('sl-price').value||0;
  $('sl-calc').innerHTML=`Сумма: <b>${money(q*pr)}</b>${p.price?'':' · <span class="low">у товара не указана цена продажи, введите вручную</span>'}`;
}
function doSellPart(){
  if($('sl-part').value===''){toast('Выберите товар');return}
  const p=state.parts[+$('sl-part').value],q=+$('sl-qty').value||0,pr=+$('sl-price').value||0;
  if(q<1||pr<=0){toast('Укажите цену и количество');return}
  if(q>p.qty){toast(`На складе только ${p.qty} шт.`);return}
  sellDone(p,q,pr,$('sl-method').value);$('dlg').open&&$('dlg').close();
}
function sellDone(p,q,pr,method){
  const x={id:nid(),date:today(),name:p.name,qty:q,price:pr,cost:p.cost,method:method==='card'?'card':'cash'};
  p.qty-=q;state.stockSales.unshift(x);logAct(`Продажа со склада: ${p.name} × ${q} на ${money(q*pr)}`,'money');
  addCashEntry(x.date,`Продажа со склада: ${p.name} × ${q}`,q*pr,`sale:stock:${x.id}`,x.method);
  render();toast(`Продано: ${p.name} × ${q}`);
}

async function sheetToBlob(){
  const sh=document.querySelector('.sheet'),W=794,H=sh.offsetHeight;
  const clone=sh.cloneNode(true);clone.style.transform='none';
  const live=[...sh.querySelectorAll('input')];
  [...clone.querySelectorAll('input')].forEach((inp,i)=>{
    const d=document.createElement('div');
    d.className='sf'+(inp.classList.contains('wide')?' wide':'');
    d.textContent=live[i].value;inp.replaceWith(d);
  });
  const css=document.querySelector('style').textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const wrap=document.createElement('div');
  wrap.setAttribute('style',`--brand:${state.set.color};width:${W}px;height:${H}px`);
  wrap.appendChild(clone);
  const xml=new XMLSerializer().serializeToString(wrap);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W*2}" height="${H*2}" viewBox="0 0 ${W} ${H}"><foreignObject width="${W}" height="${H}"><style>${css}</style>${xml}</foreignObject></svg>`;
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
  const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
}

async function myPassCheck(){
  const v=$('mp1').value;let ok=false,wait=0;
  if(SYNC.on){try{const r=await sapi('/api/password/verify',{password:v});ok=!!r.ok;wait=r.locked?r.wait:0}catch(e){}}
  else{const u=meUser();ok=!!u&&v===u.pass}

  else{if(!wait)logAct('Неверный пароль: '+mpLabel,'warn');$('mp-err').textContent=wait?`Слишком много попыток. Подождите ${wait} мин.`:'Неверный пароль';$('mp1').value=''}
}

function saveStaff(id){
  const name=$('sf-name').value.trim(),login=$('sf-login').value.trim(),pass=$('sf-pass').value;
  if(!name||!login){toast('Укажите имя и логин');return}
  if(state.staff.some(m=>m.id!==id&&(m.login||'').toLowerCase()===login.toLowerCase())){toast('Такой логин уже есть');return}
  if((!id||pass)&&pass.length<4){toast('Пароль: не короче 4 символов');return}
  const own=id&&state.staff.find(x=>x.id===id).role==='Владелец';
  const perms={},pay={};
  if(!own){
    PERMS.forEach(([k])=>{if($('pm-'+k).checked)perms[k]=true});
    const n=v=>{const x=+v;return isFinite(x)&&x>0?x:0};
    pay.salary=n($('pay-salary').value);pay.base=$('pay-base').value;pay.defPct=Math.min(100,n($('pay-def').value));pay.pct={};
    state.services.forEach(x=>{const v=$('pay-svc-'+x.id).value;if(v!=='')pay.pct[x.id]=Math.min(100,n(v))});
    pay.phonePct=Math.min(100,n($('pay-phone').value));pay.accPct=Math.min(100,n($('pay-acc').value));pay.note=$('pay-note').value.trim();
  }
  const role=own?'Владелец':$('sf-role').value,roleTitle=role==='Другое'?$('sf-roletitle').value.trim():'';
  if(id){
    const m=state.staff.find(x=>x.id===id),payChanged=!own&&JSON.stringify(m.pay||{})!==JSON.stringify(pay);
    m.name=name;m.login=login;if(pass){if(SYNC.on)queuePw(m.id,pass);else m.pass=pass}
    if(!own){m.role=role;m.roleTitle=roleTitle;m.perms=perms;m.pay=pay}
    logAct(`Изменён сотрудник: ${name}${pass?' (новый пароль)':''}${payChanged?' (изменена оплата)':''}`,'warn');
  }else{
    {const sid=state.nextStaff++;state.staff.push(Object.assign({id:sid,name,role,roleTitle,login,perms,pay},SYNC.on?{}:{pass}));if(SYNC.on)queuePw(sid,pass)}
    logAct(`Добавлен сотрудник: ${name} (${role.toLowerCase()}), разрешений: ${Object.keys(perms).length}, оклад ${money(pay.salary||0)}`,'warn');
  }
  $('dlg').close();render();toast(id?'Сотрудник сохранён':'Сотрудник добавлен');
}

const sumBy=(arr,f)=>arr.reduce((t,x)=>t+f(x),0);
function payCalc(m,ym){
  const pay=m.pay||{},inM=d=>!!d&&String(d).slice(0,7)===ym;
  const repairs=[];
  state.orders.filter(o=>o.status==='Выдан'&&inM(o.issued)).forEach(o=>itemsOf(o).forEach(it=>{if(it.master!==m.id)return;const q=itemPay(m,o,it);repairs.push({o,it,base:q.base,pct:q.pct,sum:q.sum})}));
  const phones=state.phones.filter(x=>x.sold&&x.seller===m.id&&inM(x.soldDate)).map(x=>{const pr=x.soldPrice-x.buy;return{x,pr,sum:Math.round(Math.max(0,pr)*(+pay.phonePct||0)/100)}});
  const accs=state.accSales.filter(z=>z.seller===m.id&&inM(z.date)).map(z=>{const pr=z.qty*(z.price-z.buy);return{z,pr,sum:Math.round(Math.max(0,pr)*(+pay.accPct||0)/100)}});
  const adj=state.adjust.filter(a=>a.staffId===m.id&&a.ym===ym);
  const bonus=sumBy(adj.filter(a=>a.kind==='bonus'),a=>a.amount),fine=sumBy(adj.filter(a=>a.kind==='fine'),a=>a.amount);
  const paid=sumBy(adj.filter(a=>a.kind==='advance'||a.kind==='paid'),a=>a.amount);
  const salary=+pay.salary||0,rs=sumBy(repairs,r=>r.sum),ps=sumBy(phones,r=>r.sum),as=sumBy(accs,r=>r.sum);
  const accrued=salary+rs+ps+as+bonus-fine;
  return{repairs,phones,accs,adj,bonus,fine,paid,salary,rs,ps,as,accrued,due:accrued-paid};
}

function orderPayOf(m,o){return itemsOf(o).filter(it=>m&&it.master===m.id).reduce((t,it)=>t+itemPay(m,o,it).sum,0)}
function masterStats(inF){
  const rows={};
  const get=id=>{const m=state.staff.find(x=>x.id===id)||{id:0,name:'—',pay:{}};return rows[m.id]||(rows[m.id]={m,acc:0,iss:0,rev:0,exp:0,share:0,days:0,dn:0,sales:0,salesN:0})};
  state.orders.forEach(o=>{
    if(inF(o.date))get(o.master).acc++;
    if(o.status==='Выдан'&&inF(o.issued)){
      const seen=new Set();
      itemsOf(o).forEach(it=>{
        const r=get(it.master);r.rev+=(+it.price||0);r.exp+=itemExp(o,it);r.share+=itemPay(r.m,o,it).sum;
        if(!seen.has(it.master)){seen.add(it.master);r.iss++;if(o.date&&o.issued){r.days+=Math.max(0,Math.round((new Date(o.issued+'T12:00:00')-new Date(o.date+'T12:00:00'))/864e5));r.dn++}}
      });
    }
  });
  state.phones.filter(x=>x.sold&&inF(x.soldDate)).forEach(x=>{const r=get(x.seller);r.sales+=x.soldPrice-x.buy;r.salesN++});
  state.accSales.filter(z=>inF(z.date)).forEach(z=>{const r=get(z.seller);r.sales+=z.qty*(z.price-z.buy);r.salesN+=z.qty});
  return Object.values(rows).filter(r=>r.acc||r.iss||r.salesN).sort((a,b)=>(b.rev-b.exp+b.sales)-(a.rev-a.exp+a.sales));
}
function masterStatsView(inF){
  const rows=masterStats(inF);

  const li=(t,v)=>`<div class="prow"><span>${t}</span><span class="nw">${v}</span></div>`;
  return rows.map(r=>{
    const profit=r.rev-r.exp;

async function syncTick(){

    const cur=snap(),ops=sdiff(SYNC.base,cur),pw=Object.assign({},SYNC.pw);

const itemsOf=o=>(o.items&&o.items.length)?o.items:[{id:0,service:o.service||0,master:o.master,price:o.price}];
const itemSum=o=>itemsOf(o).reduce((t,i)=>t+(+i.price||0),0);
const ordMasters=o=>[...new Set(itemsOf(o).map(i=>i.master))];
const ITEM_OPEN=['Принят','Диагностика','В работе'];
const canEditItems=o=>ITEM_OPEN.includes(o.status);
function syncItems(o){const it=itemsOf(o);o.price=itemSum(o);o.master=it[0].master;o.service=it[0].service}
function ensureItems(o){if(!o.items||!o.items.length)o.items=[{id:nid(),service:o.service||0,master:o.master,price:o.price}]}
function setSinglePrice(o,v){o.price=v;if(o.items&&o.items.length===1)o.items[0].price=v}
function itemExp(o,it){
  const items=itemsOf(o),ex=o.exp||[];
  if(items.length<2)return expSum(o);
  const direct=ex.filter(e=>e.item===it.id).reduce((t,e)=>t+e.qty*e.cost,0);
  const rest=ex.filter(e=>!items.some(i=>i.id===e.item)).reduce((t,e)=>t+e.qty*e.cost,0),tp=itemSum(o);
  return direct+(tp>0?rest*(+it.price||0)/tp:rest/items.length);
}
function itemPay(m,o,it){
  const pay=(m&&m.pay)||{},base=pay.base==='price'?(+it.price||0):Math.max(0,(+it.price||0)-itemExp(o,it));
  const own=pay.pct&&pay.pct[it.service]!==undefined&&pay.pct[it.service]!=='';
  const pct=own?+pay.pct[it.service]:(+pay.defPct||0);

}

/* ---------- касса: строки заказов, прибыль по продажам, чистка служебных записей ---------- */
function groupCashRows(list){
  const rows=[],map=new Map();
  list.forEach(c=>{
    const m=/^order:(\d+)$/.exec(c.ref||'');
    if(m&&!c.rev){const k=+m[1];let g=map.get(k);if(!g){g={order:k,entries:[],date:c.date};map.set(k,g);rows.push(g)}g.entries.push(c)}
    else rows.push({entry:c,date:c.date});
  });
  return rows;
}
function saleProfit(c){
  const r=c.ref||'';let m;
  if((m=/^sale:phone:(\d+)/.exec(r))){const x=state.phones.find(p=>p.id===+m[1]);return x&&x.sold?x.soldPrice-x.buy:null}
  if((m=/^sale:acc:(\d+)/.exec(r))){const z=state.accSales.find(a=>a.id===+m[1]);return z?z.qty*(z.price-z.buy):null}
  if((m=/^sale:stock:(\d+)/.exec(r))){const z=state.stockSales.find(a=>a.id===+m[1]);return z?z.qty*(z.price-z.cost):null}
  return null;
}

/* убрать из кассы служебные записи прежних версий: отмены, обратные записи, расходники отдельной строкой */
function fixCashLegacy(){
  if(!isOwner()&&state.me!=null)return false;
  const before=state.cash.length,drop=new Set();
  state.cash.forEach(c=>{
    const r=c.ref||'';let m;
    if(/^(exp|exprev):/.test(r))drop.add(c.id);
    if((m=/^cancel:(\w+):(\d+)/.exec(r))){drop.add(c.id);state.cash.forEach(x=>{if(x.ref===`sale:${m[1]}:${m[2]}`)drop.add(x.id)})}
    if((m=/^orderrev:(\d+)/.exec(r))){drop.add(c.id)}
    if((m=/^retrev:(\d+)/.exec(r))){drop.add(c.id);state.cash.forEach(x=>{if(x.ref===`return:${m[1]}`)drop.add(x.id)})}
    if(c.rev&&/^order:/.test(r))drop.add(c.id);
  });
  if(!drop.size)return false;
  state.cash=state.cash.filter(c=>!drop.has(c.id));
  logAct(`Касса: убраны служебные записи отмен и расходников (${before-state.cash.length})`,'warn');
  return true;
}
function cancelInfoHTML(inF,rt,wo){
  const cn=state.cancellations.filter(c=>inF(c.date)),sum=l=>l.reduce((t,c)=>t+c.amount,0);
  const toStock=cn.filter(c=>c.action==='stock'),off=cn.filter(c=>c.action==='off'),ord=cn.filter(c=>c.kind==='order');
  const rows=[['Отменённые продажи',cn.filter(c=>c.kind!=='order').length,sum(cn.filter(c=>c.kind!=='order')),`вернули на склад: ${toStock.length}, списали: ${off.length}`],['Отменённые выдачи заказов',ord.length,sum(ord),''],['Возвраты по гарантии',rt.length,rt.reduce((t,r)=>t+r.refund,0),'деньги клиентам'],['Списание товара',wo.length,wo.reduce((t,w)=>t+w.qty*w.cost,0),'потеря по себестоимости']];
  if(!rows.some(r=>r[1]))return '';
  return `<h2 style="margin-top:16px">Отмены, возвраты и списания</h2><p class="note" style="margin-top:0">Справочно. Отменённое на баланс кассы не влияет. Деньги, возвращённые клиентам по гарантии, в кассе записаны расходом.</p><div class="tblwrap"><table><tr><th>Тип</th><th>Шт.</th><th>Сумма</th></tr>${rows.filter(r=>r[1]).map(r=>`<tr><td>${r[0]}${r[3]?`<div class="note">${r[3]}</div>`:''}</td><td>${r[1]}</td><td class="nw">${money(r[2])}</td></tr>`).join('')}</table></div>`;
}
/* ---------- касса: приход, расход, чистыми ---------- */
function cashEntryCost(c){
  if(!(c.sum>0))return 0;
  const r=c.ref||'';let m;
  if((m=/^order:(\d+)$/.exec(r))&&!c.rev){const o=state.orders.find(x=>x.id===+m[1]);return o&&o.price>0?expSum(o)*c.sum/o.price:0}
  const p=saleProfit(c);return p!=null?c.sum-p:0;
}
function cashFin(l){
  let inc=0,buy=0;const parts={rep:0,cogs:0,ret:0,sal:0,rest:0};
  l.forEach(c=>{
    if(c.sum>0){inc+=c.sum;const k=cashEntryCost(c);if(k){if(/^order:/.test(c.ref||''))parts.rep+=k;else parts.cogs+=k}}
    else{const cat=cashCat(c),a=-c.sum;if(cat==='buy')buy+=a;else if(cat==='ret')parts.ret+=a;else if(cat==='sal')parts.sal+=a;else parts.rest+=a}
  });
  Object.keys(parts).forEach(k=>parts[k]=Math.round(parts[k]));
  const exp=parts.rep+parts.cogs+parts.ret+parts.sal+parts.rest;
  return {inc,exp,net:inc-exp,buy,parts};
}

function saveSlip(){
  const v=slipRead();
  if(!v.model){toast('Укажите модель');return}
  if(!v.date){toast('Проверьте дату (дд.мм.гггг)');return}
  let sl=state.sp.id?state.slips.find(x=>x.id===state.sp.id):null;
  if(sl)Object.assign(sl,v);
  else{sl=Object.assign({id:nid(),no:slipNo(),by:state.me,ts:Date.now(),sellerId:state.sp.sellerId,phoneId:state.sp.phoneId||0},v);state.slips.unshift(sl)}
  state.sp=clone(sl);logAct(`Талон гарантии ${slipCode(sl)}: ${sl.model}${sl.client?', '+sl.client:''}`,'money');
  drawSlip();toast(`Талон сохранён: ${slipCode(sl)}`);
}
function printSlip(){logAct(`Талон гарантии ${slipCode(state.sp)}: печать или PDF`);window.print()}
async function sendSlipTg(){
  const name=`talon-${slipCode(state.sp).replace(/[^\w-]/g,'')||'new'}.png`;
  toast('Готовлю фото талона…');
  let blob;try{blob=await sheetToBlob()}catch(e){toast('Не удалось собрать фото талона');return}
  const file=new File([blob],name,{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  showImage(blob,name);
}
function slipHay(sl){return [slipCode(sl),sl.client,sl.phone,phoneDigits(sl.phone),sl.model,sl.color,sl.memory,sl.imei,sl.comment,staffName(sl.sellerId||sl.by),dmy(sl.date),sl.date,String(sl.price)].join(' ')}
function slipList(){
  const all=state.slips,l=all.filter(sl=>matchS('slip',slipHay(sl))).sort((a,b)=>b.no-a.no);
  const head=`<p class="note" style="margin:4px 0">${state.qs.slip.trim()?`Найдено ${l.length} из ${all.length}`:`Всего талонов: ${all.length}`}</p>`;
  if(!l.length)return head+`<div class="empty">${state.qs.slip.trim()?'Ничего не найдено.':'Талонов пока нет. Оформите талон после продажи телефона или кнопкой «Новый талон».'}</div>`;
  return head+`<div class="sbox" data-rows="8">`+l.map(sl=>{const u=addMonthsISO(sl.date,sl.months),act=u&&u>=today();return `<div class="item"><div class="ttl">${slipCode(sl)} · ${esc(sl.model)}${sl.color?' · '+esc(sl.color):''}${sl.memory?' · '+esc(sl.memory):''}</div><div class="note">${dmy(sl.date)} · ${esc(sl.client||'без имени')}${sl.phone?' · '+esc(sl.phone):''} · продавец: ${esc(staffName(sl.sellerId||sl.by))}</div><div class="note">Цена ${money(sl.price)} · гарантия до ${dmy(u)} · <b class="${act?'plus':'minus'}">${act?'действует':'истекла'}</b></div><div class="btns"><button class="btn sm" onclick="openSlip(${sl.id})">Открыть и печать</button>${slipMine(sl)?`<button class="btn sm ghost" onclick="slipDelAsk(${sl.id})">Удалить</button>`:''}</div></div>`}).join('')+'</div>';
}
function slipsView(){return `${searchBox2('slip','Поиск: номер, клиент, телефон, модель, IMEI, продавец, дата')}<div id="res-slip">${slipList()}</div>`}
function slipDelAsk(id){
  const sl=state.slips.find(x=>x.id===id);if(!sl||!slipMine(sl))return;
  $('dlg').innerHTML=`<h2>Удалить талон?</h2><p>${slipCode(sl)} · ${esc(sl.model)}. Номер талона освободится только для следующих талонов.</p><div class="row"><button class="btn ghost" onclick="$('dlg').close()">Отмена</button><button class="btn danger" onclick="slipDel(${id})">Удалить</button></div>`;
  if(!$('dlg').open)$('dlg').showModal();
}
function slipDel(id){
  const sl=state.slips.find(x=>x.id===id);if(!sl||!slipMine(sl))return;
  state.slips=state.slips.filter(x=>x.id!==id);logAct(`Удалён талон гарантии ${slipCode(sl)}: ${sl.model}`,'del');$('dlg').close();render();toast('Талон удалён');
}
/* ---------- проверка обновления программы (без сервера) ---------- */
const UPD={busy:false};
async function checkUpdate(manual){
  if(SYNC.on||!/^https?:/.test(location.protocol)){if(manual)toast('Проверка обновления работает, когда программа открыта с сайта');return}
  if(UPD.busy)return;UPD.busy=true;
  try{
    const r=await fetch('./index.html?_='+Date.now(),{cache:'no-store'}),t=await r.text(),m=/const BUILD='([^']+)'/.exec(t);
    if(m&&m[1]!==BUILD){showUpd(m[1]);if(manual)toast('Есть новая версия: '+m[1])}
    else if(manual)toast('У вас последняя версия: '+BUILD);
  }catch(e){if(manual)toast('Нет связи, проверить не удалось')}
  UPD.busy=false;
}
function showUpd(v){
  if($('updBar2'))return;
  const d=document.createElement('div');d.id='updBar2';d.className='updbar';
  d.innerHTML=`Вышла новая версия программы: ${esc(v)}. <button class="btn sm" onclick="applyUpdate()">Обновить</button>`;
  document.body.appendChild(d);
}
async function applyUpdate(){
  try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}catch(e){}
  try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
  location.replace(location.pathname+'?u='+Date.now());
}
if(/^https?:/.test(location.protocol)){setTimeout(()=>checkUpdate(false),6000);setInterval(()=>checkUpdate(false),600000)}
/* ---------- подсказка при приёмке: клиент уже был ---------- */
let CLH=[];
function knownClients(phone){
  const d=phoneDigits(phone);if(d.length<9)return [];
  const tail=d.slice(-9),map=new Map();
  state.orders.forEach(o=>{
    const od=phoneDigits(o.phone);if(od.length<9||od.slice(-9)!==tail)return;
    const k=(o.client||'').trim();if(!k)return;
    const e=map.get(k)||{name:k,n:0,last:'',dev:''};e.n++;if(!e.last||o.date>e.last){e.last=o.date;e.dev=o.device}map.set(k,e);
  });
  return [...map.values()].sort((a,b)=>b.n-a.n||b.last.localeCompare(a.last)).slice(0,3);
}
function clientHint(){
  const box=$('f-hint');if(!box)return;
  const all=knownClients($('f-phone').value),nm=($('f-client').value||'').trim().toLowerCase();
  CLH=all.filter(c=>c.name.toLowerCase()!==nm);
  if(!all.length){box.innerHTML='';return}
  if(!CLH.length){box.innerHTML=`<div class="note" style="margin:4px 0">Клиент уже был у вас · заказов: ${all[0].n}</div>`;return}
  box.innerHTML=CLH.map((c,i)=>`<div class="note" style="margin:6px 0 2px">Клиент уже был: <b>${esc(c.name)}</b> · заказов: ${c.n} · последний ремонт: ${esc(c.dev)}, ${dmy(c.last)}</div><button class="btn sm" type="button" onclick="useClient(${i})">Подставить имя</button>`).join(' ');
}
function useClient(i){
  const c=CLH[i];if(!c)return;
  $('f-client').value=c.name;clientHint();const d=$('f-device');if(d)d.focus();
}

екст копируется, вставьте его в чат. Если Telegram нет, отправьте этот текст как SMS.": "Telegram mijoz raqami bilan chatni ochadi, agar unda Telegram bo'lsa va raqam bo'yicha topishga ruxsat bersa. Matn nusxalanadi, uni chatga qo'ying. Telegram bo'lmasa, bu matnni SMS sifatida yuboring.", "Возвраты по гарантии: ремонт, проданный телефон или аксессуар. Если вернули деньги, они спишутся с кассы. Расходники на гарантийный ремонт списываются со склада или вносятся вручную.": "Kafolat bo'yicha qaytarishlar: ta'mir, sotilgan telefon yoki aksessuar. Pul qaytarilsa, u kassadan chiqariladi. Kafolatli ta'mir uchun sarf materiallari ombordan hisobdan chiqariladi yoki qo'lda kiritiladi.", "Заказ выдан, бланк закрыт. Чтобы исправить имя, телефон, модель, IMEI или текст, нажмите «Исправить по коду». Сумму выданного заказа можно изменить, только вернув заказ в работу.": "Buyurtma topshirilgan, blank yopiq. Ism, telefon, model, IMEI yoki matnni tuzatish uchun «Kod bilan tuzatish» tugmasini bosing. Topshirilgan buyurtma summasini faqat buyurtmani ishga qaytarib o'zgartirish mumkin.", "Расходы на ремонт: расходники, списанные со склада или добавленные вручную. Для продаж: закупочная цена проданного товара. В кассу расходы автоматически не записываются.": "Ta'mir xarajatlari: ombordan hisobdan chiqarilgan yoki qo'lda qo'shilgan sarf materiallari. Sotuvlar uchun: sotilgan tovarning xarid narxi. Xarajatlar kassaga avtomatik yozilmaydi.", "Прибыль по ремонтам = стоимость минус расходники. «Доля мастера» считается по процентам из его настроек (без оклада). «Остаётся сервису» = прибыль минус доля мастера.": "Ta'mirlar foydasi = narx minus sarf materiallari. «Usta ulushi» uning sozlamalaridagi foizlar bo'yicha hisoblanadi (oyliksiz). «Servisga qoladi» = foyda minus usta ulushi.", "Каждому сотруднику выдайте логин и пароль для входа. Галочками отметьте, что ему разрешено. Без галочки это действие доступно только вам (или по вашему коду).": "Har bir xodimga kirish uchun login va parol bering. Belgilar bilan unga nima ruxsat etilganini ko'rsating. Belgisiz amal faqat sizga (yoki kodingiz orqali) mavjud.", "Скачайте копию: потом её можно загрузить при первом запуске на сервере, и ничего не потеряется. В файле есть пароли сотрудников, храните его в закрытом месте.": "Nusxani yuklab oling: keyin uni serverda birinchi ishga tushirishda yuklash mumkin, hech narsa yo'qolmaydi. Faylda xodimlar parollari bor, uni yopiq joyda saqlang.", "Скачивает заказы, клиентов, склад, кассу и журнал одним файлом. Пароли в файл не попадают. Храните его в надёжном месте: там данные ваших клиентов.": "Buyurtmalar, mijozlar, ombor, kassa va jurnalni bitta faylda yuklab oladi. Parollar faylga tushmaydi. Uni ishonchli joyda saqlang: unda mijozlaringiz ma'lumotlari bor.", "Заказ выдан: данные, бланк, цена и расходники закрыты для изменений. Комментарий можно менять. Чтобы исправить остальное, верните заказ в «Готов».": "Buyurtma topshirildi: ma'lumotlar, blank, narx va sarf materiallari o'zgartirishdan yopilgan. Izohni o'zgartirish mumkin. Qolganini tuzatish uchun buyurtmani «Tayyor» holatiga qaytaring.", "Заказ выдан: данные, бланк, цена и расходники закрыты для изменений. Комментарий можно менять. Исправить остальное может только владелец по коду.": "Buyurtma topshirildi: ma'lumotlar, blank, narx va sarf materiallari o'zgartirishdan yopilgan. Izohni o'zgartirish mumkin. Qolganini faqat ega kod orqali tuzatishi mumkin.", "Вся статистика по сервису: ремонты, продажи, запчасти, возвраты и люди. Данные считаются по выбранному периоду, поиск и мастер сужают всё сразу.": "Servis bo'yicha barcha statistika: ta'mirlar, sotuvlar, ehtiyot qismlar, qaytarishlar va odamlar. Ma'lumotlar tanlangan davr bo'yicha hisoblanadi, qidiruv va usta hammasini birdan toraytiradi.", "До статуса «Выдан» бланк и гарантию можно менять. После выдачи они закрыты: изменить может только владелец по коду, изменение попадёт в журнал.": "«Topshirildi» holatigacha blank va kafolatni o'zgartirish mumkin. Topshirilgandan keyin ular yopiladi: faqat ega kod orqali o'zgartira oladi, o'zgarish jurnalga yoziladi.", "Внимание: в этом режиме данные не сохраняются и пропадут при закрытии страницы. Откройте программу с сервера или с обычного адреса сайта.": "Diqqat: bu rejimda ma'lumotlar saqlanmaydi va sahifa yopilganda yo'qoladi. Dasturni serverdan yoki oddiy sayt manzilidan oching.", "Расходники вернутся на склад, деньги по возврату вернутся в кассу, товар, принятый обратно, уберётся со склада, а списание отменится.": "Sarf materiallari omborga qaytadi, qaytarish bo'yicha pullar kassaga qaytadi, qaytarib qabul qilingan tovar ombordan olib tashlanadi, hisobdan chiqarish bekor qilinadi.", "Проценты считаются по заказам со статусом «Выдан», выданным в этом месяце. Оплата настраивается у каждого сотрудника в Настройках.": "Foizlar shu oyda topshirilgan, «Topshirildi» holatidagi buyurtmalar bo'yicha hisoblanadi. To'lov har bir xodim uchun Sozlamalarda belgilanadi.", "дн., старые удаляются сами. Здесь видно, кто что делал, включая удаления и неверные коды. Изменить или стереть запись нельзя.": "kun, eskilari o'zi o'chiriladi. Bu yerda kim nima qilgani ko'rinadi, jumladan o'chirishlar va noto'g'ri kodlar. Yozuvni o'zgartirib yoki o'chirib bo'lmaydi.", "Останется только владелец (логин admin, пароль admin, поменяйте его сразу в Настройках). Услуги и данные компании сохранятся.": "Faqat ega qoladi (login admin, parol admin, uni darhol Sozlamalarda o'zgartiring). Xizmatlar va kompaniya ma'lumotlari saqlanadi.", "Если у сотрудника нет права на действие, он сможет выполнить его, только если вы введёте этот код. Сотрудники код не видят.": "Agar xodimda amalga ruxsat bo'lmasa, uni faqat siz shu kodni kiritganingizda bajara oladi. Xodimlar kodni ko'rmaydi.", "Список работ, по которым считаются проценты мастеров. В заказе выбирается услуга, у каждого мастера на услугу свой процент.": "Ustalar foizi hisoblanadigan ishlar ro'yxati. Buyurtmada xizmat tanlanadi, har bir ustada xizmat uchun o'z foizi bor. .", "Демо: владелец admin / admin, мастер rustam / 1234. Данные пока не сохраняются после обновления страницы.": "Demo: ega admin / admin, usta rustam / 1234. Ma'lumotlar sahifa yangilanganda hozircha saqlanmaydi.", "Здесь вы видите свою зарплату. Изменить данные нельзя. Если что-то не сходится, свяжитесь с руководством.": "Bu yerda o'z ish haqingizni ko'rasiz. Ma'lumotlarni o'zgartirib bo'lmaydi. Agar nimadir mos kelmasa, rahbariyat bilan bog'laning.", "Поставщики запчастей и товаров. Добавлять могут все сотрудники, менять и удалять — по коду владельца.": "Ehtiyot qismlar va tovarlar yetkazib beruvchilari. Hamma xodimlar qo'sha oladi, o'zgartirish va o'chirish — ega kodi bilan.", "Выберите даты «С» и «По» (или быстрый период), чтобы увидеть сравнение с прошлым таким же периодом.": "O'tgan shunday davr bilan taqqoslashni ko'rish uchun «Sanadan» va «Sanagacha» sanalarini (yoki tez davrni) tanlang.", "Здесь видно, кто что делал, включая удаления и неверные коды. Изменить или стереть запись нельзя.": "Bu yerda kim nima qilgani ko'rinadi, jumladan o'chirishlar va noto'g'ri kodlar. Yozuvni o'zgartirib yoki o'chirib bo'lmaydi.", "IMEI похож на ошибочный (нужно 15 цифр). Проверьте или нажмите ещё раз, чтобы сохранить как есть.": "IMEI noto'g'ri ko'rinadi (15 ta raqam kerak). Tekshiring yoki shundayligicha saqlash uchun yana bosing.", "Заказ выдан: бланк закрыт для изменений. Чтобы что-то исправить, верните заказ в статус «Готов».": "Buyurtma topshirildi: blank o'zgartirishdan yopilgan. Biror narsani tuzatish uchun buyurtmani «Tayyor» holatiga qaytaring.", "Нажмите и удерживайте картинку, затем «Поделиться» или «Сохранить», и отправьте в Telegram.": "Rasmni bosib turing, so'ng «Ulashish» yoki «Saqlash» ni tanlang va Telegramga yuboring.", "Логотип, названия и контакты берутся из полей выше. Здесь срок и текст условий для талона.": "Logotip, nomlar va kontaktlar yuqoridagi maydonlardan olinadi. Bu yerda talon uchun muddat va shartlar matni.", "Заказ закрыт (выдан). Изменение
